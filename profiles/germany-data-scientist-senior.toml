# ─────────────────────────────────────────────────────────────────────────────
#  JobFleet search profile — this one file decides WHERE you look, at what
#  LEVEL, and for WHICH roles. Edit it in any text editor, save, run again.
#  Re-create it any time with Setup.bat (or `jobfleet setup`).
# ─────────────────────────────────────────────────────────────────────────────

name = "Germany · senior data scientist"

# ── WHERE ──
[location]
countries = ["Germany"]
cities    = []   # optional: only these cities (remote jobs still count)
remote    = "include"   # include | only | exclude

# ── LEVEL ──
[experience]
min_years = 5
max_years = 15
level     = "senior"   # student | early_career | mid | senior | leadership

# ── WHAT ── one [[role_family]] per kind of job; each gets its own list and dashboard tab.
# Add titles freely (word order does not matter). Delete a block to drop that family.

[[role_family]]
id     = "data_science"
name   = "Data Science & ML"
titles = [
  "Data Scientist", "Machine Learning Engineer", "ML Engineer", "AI Engineer", "Applied Scientist",
  "Research Scientist", "NLP Engineer", "Computer Vision Engineer", "Decision Scientist",
]
title_keywords = ["data scientist", "machine learning", "deep learning", "artificial intelligence"]
keywords = [
  "python", "machine learning", "statistics", "pytorch", "tensorflow", "scikit-learn", "sql", "nlp", "llm",
  "deep learning", "modeling", "experimentation",
]
domains = ["data_science_ml", "engineering"]   # job areas this family covers (otherwise filtered out)

[[role_family]]
id     = "data_engineering"
name   = "Data Engineering"
titles = [
  "Data Engineer", "Big Data Engineer", "ETL Developer", "Analytics Engineer", "Data Platform Engineer",
  "Data Warehouse Engineer", "Data Integration Engineer",
]
title_keywords = ["data engineer", "etl", "data pipeline", "data platform", "data warehouse"]
keywords = [
  "sql", "python", "spark", "airflow", "dbt", "snowflake", "databricks", "kafka", "etl", "aws", "bigquery",
  "redshift",
]
domains = ["engineering"]   # job areas this family covers (otherwise filtered out)

# Words typed into job-board search boxes (only some sources need them).
[search]
keywords = [
  "data scientist", "machine learning engineer", "ai engineer", "data engineer", "analytics engineer",
  "etl developer",
]

# ── OPTIONAL: Claude (your Claude subscription via the Claude Code CLI; no API key) ──
[ai]
enabled = true

[advanced.title_abbreviations]   # shorthands expanded in job titles
ai = "artificial intelligence"

# ─────────────────────────────────────────────────────────────────────────────
#  JobFleet search profile — this one file decides WHERE you look, at what
#  LEVEL, and for WHICH roles. Edit it in any text editor, save, run again.
#  Re-create it any time with Setup.bat (or `jobfleet setup`).
# ─────────────────────────────────────────────────────────────────────────────

name = "United Kingdom · early-career marketing"

# ── WHERE ──
[location]
countries = ["United Kingdom"]
cities    = []   # optional: only these cities (remote jobs still count)
remote    = "include"   # include | only | exclude

# ── LEVEL ──
[experience]
min_years = 0
max_years = 3
level     = "early_career"   # student | early_career | mid | senior | leadership

# ── WHAT ── one [[role_family]] per kind of job; each gets its own list and dashboard tab.
# Add titles freely (word order does not matter). Delete a block to drop that family.

[[role_family]]
id     = "marketing"
name   = "Marketing"
titles = [
  "Marketing Executive", "Marketing Coordinator", "Marketing Specialist", "Marketing Associate",
  "Marketing Assistant", "Digital Marketing Executive", "Digital Marketing Specialist",
  "Social Media Executive", "Social Media Coordinator", "SEO Specialist", "Content Marketing Executive",
  "Performance Marketing Executive", "Brand Executive", "Growth Marketing Associate",
  "Email Marketing Specialist", "Campaign Executive", "Marketing Officer",
]
title_keywords = ["marketing", "seo", "social media", "brand", "campaign", "growth"]
keywords = [
  "google ads", "meta ads", "seo", "sem", "content", "social media", "hubspot", "google analytics",
  "email marketing", "crm", "campaigns", "copywriting",
]
domains = ["martech"]   # job areas this family covers (otherwise filtered out)

# Words typed into job-board search boxes (only some sources need them).
[search]
keywords = ["marketing executive", "digital marketing", "marketing coordinator"]

# ── OPTIONAL: Claude (your Claude subscription via the Claude Code CLI; no API key) ──
[ai]
enabled = true

[advanced.title_abbreviations]   # shorthands expanded in job titles
smm = "social media marketing"

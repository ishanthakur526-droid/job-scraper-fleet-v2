# Cloud mode, step 1: fill in this form (Actions -> Set up my profile -> Run workflow).
# It writes profile.toml into your repository and starts the first "Find jobs" run.
name: Set up my profile

on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Country or countries to work in, comma-separated (e.g. India, or United States, Canada)"
        required: true
        default: "India"
      cities:
        description: "Optional: only these cities, comma-separated (leave empty for the whole country)"
        required: false
        default: ""
      remote:
        description: "Remote jobs"
        type: choice
        options: ["include", "only", "exclude"]
        default: "include"
      years:
        description: "Your years of work experience (a number, e.g. 0, 2 or 6)"
        required: true
        default: "0"
      family_1:
        description: "Kind of job"
        type: choice
        options:
          - "Software Engineering"
          - "DevOps & Cloud"
          - "Data Engineering"
          - "Data Science & ML"
          - "Data & BI Analytics"
          - "Research & Insights"
          - "Excel / MIS Reporting"
          - "Product Management"
          - "Project & Program Management"
          - "Design (UX/UI)"
          - "QA & Testing"
          - "Cybersecurity"
          - "IT Support & Systems"
          - "Marketing"
          - "Sales & Business Development"
          - "Customer Success & Support"
          - "HR & Recruiting"
          - "Finance & Accounting"
          - "Operations & Supply Chain"
          - "Content & Writing"
          - "Legal & Compliance"
        default: "Data & BI Analytics"
      family_2:
        description: "Another kind of job (optional)"
        type: choice
        options: ["(none)", "Software Engineering", "DevOps & Cloud", "Data Engineering", "Data Science & ML", "Data & BI Analytics",
                  "Research & Insights", "Excel / MIS Reporting", "Product Management", "Project & Program Management", "Design (UX/UI)",
                  "QA & Testing", "Cybersecurity", "IT Support & Systems", "Marketing", "Sales & Business Development",
                  "Customer Success & Support", "HR & Recruiting", "Finance & Accounting", "Operations & Supply Chain",
                  "Content & Writing", "Legal & Compliance"]
        default: "(none)"
      family_3:
        description: "A third kind of job (optional)"
        type: choice
        options: ["(none)", "Software Engineering", "DevOps & Cloud", "Data Engineering", "Data Science & ML", "Data & BI Analytics",
                  "Research & Insights", "Excel / MIS Reporting", "Product Management", "Project & Program Management", "Design (UX/UI)",
                  "QA & Testing", "Cybersecurity", "IT Support & Systems", "Marketing", "Sales & Business Development",
                  "Customer Success & Support", "HR & Recruiting", "Finance & Accounting", "Operations & Supply Chain",
                  "Content & Writing", "Legal & Compliance"]
        default: "(none)"
      extra_titles:
        description: "Optional: more job titles to include, comma-separated (e.g. Power BI Developer, Pricing Analyst)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --quiet -e .

      - name: Write profile.toml
        env:  # form values are passed as data, never pasted into the script
          COUNTRIES: ${{ inputs.countries }}
          CITIES: ${{ inputs.cities }}
          REMOTE: ${{ inputs.remote }}
          YEARS: ${{ inputs.years }}
          F1: ${{ inputs.family_1 }}
          F2: ${{ inputs.family_2 }}
          F3: ${{ inputs.family_3 }}
          TITLES: ${{ inputs.extra_titles }}
        run: |
          FAMILIES="$F1"
          for f in "$F2" "$F3"; do [ "$f" != "(none)" ] && FAMILIES="$FAMILIES;$f"; done
          python -m jobfleet setup --yes --no-ai --countries "$COUNTRIES" --cities "$CITIES" --remote "$REMOTE" \
            --years "$YEARS" --families "$FAMILIES" --titles "$TITLES"
          {
            echo "### Your profile"
            echo '```toml'
            sed -n '/^\[location\]/,/^\[\[role_family\]\]/p' profile.toml | head -20
            echo '```'
            echo "Edit **profile.toml** in your repository any time to fine-tune it ([guide](../blob/main/docs/CUSTOMIZE.md))."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save it to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.toml
          git commit -m "Set up my JobFleet profile" || echo "Profile unchanged"
          git push

      - name: Start the first job search
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run find-jobs.yml --ref "${{ github.ref_name }}"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfleet"
version = "4.0.0"
description = "Your own daily job list from company career sites: any country, any level, any role family. Free and open source."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ishan Thakur" }]
keywords = ["jobs", "job-search", "career", "workday", "greenhouse", "lever", "job-alerts"]
dependencies = [
  "beautifulsoup4>=4.12",
  "curl_cffi>=0.7",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ishanthakur526-droid/jobfleet"
"Live demo" = "https://ishanthakur526-droid.github.io/jobfleet/"

[project.scripts]
jobfleet = "jobfleet.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobfleet = ["data/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 150
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]
